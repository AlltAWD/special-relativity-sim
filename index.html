<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Interactive simulations of special relativity in the browser: Minkowski diagrams, time dilation, length contraction, velocity addition, the twin paradox and more, in natural units (c = 1)."
    />
    <meta property="og:title" content="Special Relativity Simulator" />
    <meta
      property="og:description"
      content="Interactive simulations of special relativity in the browser, in natural units (c = 1)."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Special Relativity Simulator</title>
    <script>
      // Choose the theme before the first paint, so the page never flashes the wrong one.
      // src/ui/theme.ts takes over from here.
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem('theme');
        } catch (e) {}
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to the simulation</a>
    <div class="app">
      <header class="topbar">
        <a class="brand" href="#" aria-label="Special Relativity Simulator, first simulation">
          <!-- The mark is a light cone: two 45-degree light lines with the future shaded. -->
          <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
            <rect class="brand-mark-tile" width="32" height="32" rx="9" />
            <path class="brand-mark-cone" d="M16 16 8 8h16z" />
            <path class="brand-mark-light" d="M8 8l16 16M24 8 8 24" />
          </svg>
          <span class="brand-name">Special Relativity</span>
        </a>
        <!-- main.ts puts the icons in these two. -->
        <div class="topbar-actions">
          <button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch theme"></button>
          <a
            id="source-link"
            class="icon-btn"
            href="https://github.com/AlltAWD/special-relativity-sim"
            aria-label="Source code on GitHub"
            title="Source code on GitHub"
          ></a>
        </div>
      </header>
      <nav id="nav" aria-label="Simulations">
        <ol class="nav-list"></ol>
        <aside class="nav-note" aria-label="Units">
          <p class="nav-note-title">Units</p>
          <p>
            <span class="math"><var>c</var> = 1</span>, so every speed is a fraction of the speed of light, and one
            unit of distance is how far light travels in one unit of time.
          </p>
          <p><span class="math"><var>γ</var> = 1 / √(1 − <var>v</var>²)</span></p>
        </aside>
      </nav>
      <main id="main" tabindex="-1">
        <header class="sim-head">
          <h1 id="sim-title"></h1>
          <p id="sim-blurb" class="blurb"></p>
        </header>
        <div id="stage">
          <noscript><p class="blurb">The simulations are drawn by JavaScript, which is turned off in this browser.</p></noscript>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
